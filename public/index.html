<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Búsqueda Multiusuario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    header { margin-bottom: 30px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; }
    
    .accounts-section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
    .accounts-title { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 12px; text-transform: uppercase; }
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    
    .account-chip { background: #e3f2fd; border: 1px solid #90caf9; border-radius: 20px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; }
    .account-chip .email { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-chip button { background: none; border: none; color: #1976d2; cursor: pointer; font-size: 14px; padding: 0 4px; }
    
    .add-account { border: 2px dashed #bbb; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .add-account:hover { border-color: #1976d2; background: #f5f5f5; }
    .add-account button { background: none; border: none; cursor: pointer; font-size: 16px; color: #1976d2; font-weight: 600; }
    
    .search-section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
    .search-box { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { padding: 12px 24px; background: #1976d2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    button:hover { background: #1565c0; }
    
    .results-section { background: white; border-radius: 8px; padding: 20px; border: 1px solid #e0e0e0; }
    .results-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
    .result-item { padding: 12px; border-left: 4px solid #1976d2; background: #fafafa; margin-bottom: 10px; border-radius: 4px; }
    .result-type { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    .result-content { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .result-email { font-size: 12px; color: #999; }
    
    .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .success { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 Búsqueda Centralizada</h1>
      <p class="subtitle">Busca en todas tus cuentas de Gmail y Drive desde un solo lugar</p>
    </header>

    <div class="accounts-section">
      <div class="accounts-title">Cuentas conectadas</div>
      <div class="accounts-grid" id="accountsList">
        <div class="add-account" onclick="connectAccount()">
          <button>+ Agregar cuenta</button>
        </div>
      </div>
    </div>

    <div class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Escribí una palabra clave, remitente, archivo…">
        <button onclick="search()">Buscar</button>
      </div>
      <div id="message"></div>
    </div>

    <div class="results-section">
      <div class="results-title">Resultados</div>
      <div id="resultsList" class="hidden">
        <p id="resultCount" style="margin-bottom: 15px; color: #666; font-size: 14px;"></p>
        <div id="results"></div>
      </div>
      <div id="noResults" style="text-align: center; color: #999; padding: 20px;">
        Escribí algo y clickeá "Buscar" para empezar
      </div>
    </div>
  </div>

  <script>
    let accounts = [];

    // Cargar cuentas conectadas al iniciar
    async function loadAccounts() {
      const res = await fetch('/accounts');
      const data = await res.json();
      accounts = data.accounts || [];
      renderAccounts();
    }

    function renderAccounts() {
      const list = document.getElementById('accountsList');
      let html = '';
      
      accounts.forEach(email => {
        html += `
          <div class="account-chip">
            <span class="email">${email}</span>
            <button onclick="removeAccount('${email}')">✕</button>
          </div>
        `;
      });
      
      html += `<div class="add-account" onclick="connectAccount()"><button>+ Agregar</button></div>`;
      list.innerHTML = html;
    }

    function connectAccount() {
      fetch('/auth/url')
        .then(res => res.json())
        .then(data => {
          window.open(data.url, 'auth', 'width=500,height=600');
          window.addEventListener('message', (e) => {
            if (e.data.type === 'AUTH_SUCCESS') {
              loadAccounts();
            }
          });
        });
    }

    async function removeAccount(email) {
      await fetch('/remove-account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      loadAccounts();
    }

    async function search() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const msg = document.getElementById('message');
      msg.innerHTML = '<div class="success">Buscando…</div>';

      const res = await fetch('/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
      const data = await res.json();

      if (data.error) {
        msg.innerHTML = `<div class="error">${data.error}</div>`;
        return;
      }

      const totalResults = (data.gmail?.length || 0) + (data.drive?.length || 0);
      document.getElementById('resultCount').textContent = `${totalResults} resultado(s) encontrado(s)`;
      
      let resultsHtml = '';
      
      if (data.gmail?.length > 0) {
        data.gmail.forEach(item => {
          resultsHtml += `
            <div class="result-item">
              <div class="result-type">📧 Gmail</div>
              <div class="result-email">${item.email}</div>
            </div>
          `;
        });
      }

      if (data.drive?.length > 0) {
        data.drive.forEach(item => {
          resultsHtml += `
            <div class="result-item">
              <div class="result-type">📁 Drive</div>
              <div class="result-content"><a href="${item.link}" target="_blank">${item.name}</a></div>
              <div class="result-email">${item.email}</div>
            </div>
          `;
        });
      }

      if (resultsHtml) {
        document.getElementById('results').innerHTML = resultsHtml;
        document.getElementById('resultsList').classList.remove('hidden');
        document.getElementById('noResults').classList.add('hidden');
        msg.innerHTML = '';
      } else {
        document.getElementById('resultsList').classList.add('hidden');
        document.getElementById('noResults').classList.remove('hidden');
        msg.innerHTML = '<div class="success">Sin resultados</div>';
      }
    }

    loadAccounts();
  </script>
</body>
</html>
